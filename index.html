<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joyaux d’Égypte</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="scene">
  <section id="gauche">
    <h1 class="titre">JOYAUX D’ÉGYPTE</h1>
    <div id="carte" aria-label="Carte de l’Égypte et du Nil"></div>

    <div id="bulle" class="bulle" role="tooltip" hidden>
      <p class="bulle-nom"></p>
      <p class="bulle-lieu"></p>
      <p class="bulle-texte"></p>
    </div>

    <div class="zoom">
      <button id="zoom-plus" type="button" aria-label="Zoomer">+</button>
      <button id="zoom-moins" type="button" aria-label="Dézoomer">−</button>
      <button id="zoom-reset" type="button" aria-label="Vue complète">⤢</button>
    </div>

    <button id="muet" class="son" type="button" aria-pressed="false">Son : on</button>

    <div id="reglette" aria-hidden="true"></div>
  </section>

  <section id="droite">
    <div id="collier-zone">
      <svg id="collier" aria-hidden="true"></svg>
    </div>
    <button id="cisailles" type="button" aria-label="Réinitialiser le collier"></button>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="textures"></defs>
</svg>

<!-- flubber : voir js/vendor/README.txt -->
<script src="js/vendor/flubber.min.js"></script>
<script src="js/sons.js"></script>
<script src="js/carte.js"></script>
<script src="js/reglette.js"></script>
<script src="js/collier.js"></script>
<script src="js/app.js"></script>
</body>
</html>
